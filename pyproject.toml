[project]
name = "mcp-book-template-advanced"
version = "0.1.0"
description = "FastMCP server with Google Places Text Search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4",
    "pydantic>=2.7,<3",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_book_template_advanced"]
